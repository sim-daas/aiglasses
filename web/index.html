<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI Glasses - 3D Depth Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0.95);
        }

        /* Three.js canvas for depth occlusion */
        canvas {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        /* 3D text card overlay with proper transform support */
        .card3d {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            transform-style: preserve-3d;
            width: 260px;
            height: 140px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 0px solid rgba(0, 255, 160, 0.23);
            border-radius: 8px;
            color: #00ff88;
            font: 700 22px/1.18 "Inter", system-ui;
            will-change: transform;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        #cards {
            position: absolute;
            inset: 0;
            pointer-events: none;
            perspective: 900px;
            transform-style: preserve-3d;
        }

        /* Status overlay */
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.5);
            font-size: 14px;
            z-index: 100;
        }

        .status-connected {
            color: #0f0;
        }

        .status-disconnected {
            color: #f00;
        }

        /* HUD controls */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        #hud input {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #eee;
            font-size: 14px;
        }

        #ask {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #3a3;
            background: #0b3;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        #ask:hover {
            background: #0d5;
        }

        /* Control panel */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            min-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            font-size: 12px;
        }

        #controls h3 {
            margin: 0 0 10px 0;
            color: #0f0;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 3px;
            color: #aaa;
            font-size: 11px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-group .value {
            display: inline-block;
            float: right;
            color: #0f0;
            font-weight: bold;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: 1px solid #555;
            background: #222;
            cursor: pointer;
        }

        #toggle-controls {
            position: absolute;
            bottom: 20px;
            left: 340px;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #0f0;
            cursor: pointer;
            font-size: 12px;
            z-index: 101;
        }

        #toggle-controls:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .controls-hidden {
            display: none;
        }

        /* Depth info panel */
        #depth-info {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            font-size: 12px;
            z-index: 100;
            color: #0f0;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <img id="feed" src="/video_feed" alt="Camera Feed" />

        <!-- Three.js canvas will be inserted here -->

        <div id="cards"></div>

        <div id="hud">
            <input id="q" size="32" placeholder="Type a question, tap object, hit Ask…" />
            <button id="ask">Ask</button>
        </div>

        <div id="status" class="status-disconnected">Connecting...</div>

        <div id="depth-info">
            Depth: <span id="depth-value">--</span> cm<br>
            3D Mode: <span id="mode-3d">Loading...</span>
        </div>

        <button id="toggle-controls">Toggle Controls</button>

        <div id="controls">
            <h3>3D Overlay Settings</h3>

            <div class="control-group">
                <label>Text Shadow Blur <span class="value" id="val-shadow-blur">0</span>px</label>
                <input type="range" id="shadow-blur" min="0" max="30" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Text Shadow Spread <span class="value" id="val-shadow-spread">0</span>px</label>
                <input type="range" id="shadow-spread" min="0" max="50" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Box Shadow Depth <span class="value" id="val-box-shadow">7</span>px</label>
                <input type="range" id="box-shadow" min="0" max="60" value="7" step="1">
            </div>

            <div class="control-group">
                <label>Background Opacity <span class="value" id="val-bg-opacity">0.35</span></label>
                <input type="range" id="bg-opacity" min="0" max="100" value="35" step="1">
            </div>

            <div class="control-group">
                <label>Border Opacity <span class="value" id="val-border-opacity">0.23</span></label>
                <input type="range" id="border-opacity" min="0" max="100" value="23" step="1">
            </div>

            <div class="control-group">
                <label>Border Width <span class="value" id="val-border-width">0</span>px</label>
                <input type="range" id="border-width" min="0" max="10" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Text Color</label>
                <input type="color" id="text-color" value="#00ff88">
            </div>

            <div class="control-group">
                <label>Border Color</label>
                <input type="color" id="border-color" value="#00ffa0">
            </div>

            <div class="control-group">
                <label>Font Size <span class="value" id="val-font-size">22</span>px</label>
                <input type="range" id="font-size" min="12" max="40" value="22" step="1">
            </div>

            <div class="control-group">
                <label>Perspective <span class="value" id="val-perspective">900</span>px</label>
                <input type="range" id="perspective" min="300" max="2000" value="900" step="50">
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="enable-depth-occlusion" checked>
                    Enable Depth Occlusion
                </label>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script>
        console.log('🚀 AURA AI Glasses - 3D Depth-Aware Overlay');

        const wrap = document.getElementById('wrap');
        const feed = document.getElementById('feed');
        const cards = document.getElementById('cards');
        const status = document.getElementById('status');
        const depthValueEl = document.getElementById('depth-value');
        const mode3dEl = document.getElementById('mode-3d');
        const panels = new Map();

        // Three.js setup for depth occlusion
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(wrap.clientWidth, wrap.clientHeight);
        wrap.insertBefore(renderer.domElement, cards); // Insert before cards overlay

        let camera, fx = 900, fy = 900, cx = 320, cy = 240, imgW = 640, imgH = 480;

        function setCameraFromIntrinsics() {
            const fovY = 2 * Math.atan(imgH / (2 * fy)) * 180 / Math.PI;
            camera = new THREE.PerspectiveCamera(fovY, wrap.clientWidth / wrap.clientHeight, 0.05, 20);
            camera.position.set(0, 0, 0);
            camera.lookAt(0, 0, -1);
        }
        setCameraFromIntrinsics();

        // Depth mesh for occlusion
        let depthMesh, gridW = 0, gridH = 0, depthData = null;
        let depthOcclusionEnabled = true;

        function buildDepthMesh() {
            if (depthMesh) scene.remove(depthMesh);
            const geo = new THREE.PlaneGeometry(2, 2, gridW - 1, gridH - 1);
            const mat = new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true, depthTest: true });
            mat.colorWrite = false; // Pure occluder
            depthMesh = new THREE.Mesh(geo, mat);
            depthMesh.frustumCulled = false;
            scene.add(depthMesh);
            mode3dEl.textContent = `Active (${gridW}x${gridH})`;
        }

        // Convert image pixel + depth to 3D camera space
        function unproject(u, v, Z) {
            const X = (u - cx) / fx * Z;
            const Y = -(v - cy) / fy * Z;
            return new THREE.Vector3(X, Y, -Z);
        }

        // Update depth mesh vertices
        function updateDepthMesh() {
            if (!depthMesh || !depthData || !depthOcclusionEnabled) return;
            const pos = depthMesh.geometry.attributes.position;
            let idx = 0;
            for (let j = 0; j < gridH; j++) {
                for (let i = 0; i < gridW; i++) {
                    const Z = depthData[j * gridW + i] || 6.0;
                    const u = (i + 0.5) * (imgW / gridW);
                    const v = (j + 0.5) * (imgH / gridH);
                    const p = unproject(u, v, Math.max(0.05, Math.min(6.0, Z)));
                    pos.setXYZ(idx, p.x, p.y, p.z);
                    idx++;
                }
            }
            pos.needsUpdate = true;
            depthMesh.geometry.computeVertexNormals();
        }

        // Fetch depth grid from server
        async function fetchDepth() {
            try {
                const r = await fetch('/depth');
                const j = await r.json();
                if (j && j.z) {
                    imgW = j.w; imgH = j.h; fx = j.fx; fy = j.fy; cx = j.cx; cy = j.cy;
                    if (gridW !== j.gw || gridH !== j.gh) {
                        gridW = j.gw; gridH = j.gh;
                        buildDepthMesh();
                        setCameraFromIntrinsics();
                    }
                    depthData = j.z;
                    updateDepthMesh();

                    // Update center depth display
                    const centerIdx = Math.floor(gridH / 2) * gridW + Math.floor(gridW / 2);
                    const centerDepth = depthData[centerIdx];
                    if (centerDepth) {
                        depthValueEl.textContent = (centerDepth * 100).toFixed(0);
                    }
                }
            } catch (e) {
                console.warn('Depth fetch failed:', e);
            }
            setTimeout(fetchDepth, 90);
        }
        // Start depth fetching
        fetchDepth();

        // Adjustable parameters
        const params = {
            shadowBlur: 0,
            shadowSpread: 0,
            boxShadow: 7,
            bgOpacity: 0.35,
            borderOpacity: 0.23,
            borderWidth: 0,
            textColor: '#00ff88',
            borderColor: '#00ffa0',
            fontSize: 22,
            perspective: 900
        };

        // Setup control sliders
        function setupControls() {
            const controls = {
                'shadow-blur': (v) => { params.shadowBlur = v; updatePanels(); },
                'shadow-spread': (v) => { params.shadowSpread = v; updatePanels(); },
                'box-shadow': (v) => { params.boxShadow = v; updatePanels(); },
                'bg-opacity': (v) => { params.bgOpacity = v / 100; updatePanels(); },
                'border-opacity': (v) => { params.borderOpacity = v / 100; updatePanels(); },
                'border-width': (v) => { params.borderWidth = v; updatePanels(); },
                'text-color': (v) => { params.textColor = v; updatePanels(); },
                'border-color': (v) => { params.borderColor = v; updatePanels(); },
                'font-size': (v) => { params.fontSize = v; updatePanels(); },
                'perspective': (v) => { params.perspective = v; cards.style.perspective = `${v}px`; }
            };

            Object.keys(controls).forEach(id => {
                const el = document.getElementById(id);
                const valEl = document.getElementById(`val-${id}`);

                el.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (valEl) {
                        if (id === 'bg-opacity' || id === 'border-opacity') {
                            valEl.textContent = (val / 100).toFixed(2);
                        } else {
                            valEl.textContent = val;
                        }
                    }
                    controls[id](val);
                });
            });

            document.getElementById('toggle-controls').addEventListener('click', () => {
                document.getElementById('controls').classList.toggle('controls-hidden');
            });

            document.getElementById('enable-depth-occlusion').addEventListener('change', (e) => {
                depthOcclusionEnabled = e.target.checked;
                mode3dEl.textContent = depthOcclusionEnabled ? `Active (${gridW}x${gridH})` : 'Disabled';
            });
        }

        // Update all panel styles
        function updatePanels() {
            panels.forEach(el => {
                el.style.background = `rgba(0, 0, 0, ${params.bgOpacity})`;
                el.style.border = `${params.borderWidth}px solid rgba(${hexToRgb(params.borderColor)}, ${params.borderOpacity})`;
                el.style.color = params.textColor;
                el.style.fontSize = `${params.fontSize}px`;
                if (params.shadowBlur > 0 || params.shadowSpread > 0) {
                    el.style.textShadow = `0 0 ${params.shadowBlur}px ${params.textColor}, 0 0 ${params.shadowSpread}px ${params.textColor}`;
                } else {
                    el.style.textShadow = 'none';
                }
                el.style.boxShadow = `0 10px ${params.boxShadow}px rgba(0, 0, 0, 0.5)`;
            });
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function imgToScreen(x, y) {
            const vw = wrap.clientWidth, vh = wrap.clientHeight;
            const s = Math.min(vw / imgW, vh / imgH);
            const dispW = imgW * s, dispH = imgH * s;
            const offX = (vw - dispW) / 2, offY = (vh - dispH) / 2;
            return [offX + x * s, offY + y * s];
        }

        function orderCorners(pts) {
            pts = pts.slice();
            pts.sort((p, q) => (p[1] - q[1]) || (p[0] - q[0]));
            const tl = pts[0], tr = pts[1];
            const bl = pts[2], br = pts[3];
            const top = (tl[0] < tr[0]) ? [tl, tr] : [tr, tl];
            const bottom = (bl[0] < br[0]) ? [bl, br] : [br, bl];
            return [top[0], top[1], bottom[1], bottom[0]];
        }

        function cssMatrixForQuad(xy, w = 260, h = 140) {
            const x0 = xy[0][0], y0 = xy[0][1];
            const x1 = xy[1][0], y1 = xy[1][1];
            const x2 = xy[2][0], y2 = xy[2][1];
            const x3 = xy[3][0], y3 = xy[3][1];

            const dx1 = x1 - x2, dy1 = y1 - y2;
            const dx2 = x3 - x2, dy2 = y3 - y2;
            const sx = x0 - x1 + x2 - x3;
            const sy = y0 - y1 + y2 - y3;

            const g = (sx * dy2 - dx2 * sy) / (dx1 * dy2 - dy1 * dx2);
            const h2 = (dx1 * sy - sx * dy1) / (dx1 * dy2 - dy1 * dx2);

            let a = x1 - x0 + g * x1;
            let b = x3 - x0 + h2 * x3;
            let c = x0;
            let d = y1 - y0 + g * y1;
            let e = y3 - y0 + h2 * y3;
            let f = y0;
            let g1 = g, h1 = h2;

            a /= w; b /= h; d /= w; e /= h; g1 /= w; h1 /= h;

            return `matrix3d(${a}, ${d}, 0, ${g1}, ${b}, ${e}, 0, ${h1}, 0, 0, 1, 0, ${c}, ${f}, 0, 1)`;
        }

        function ensurePanel(id, text) {
            if (!panels.has(id)) {
                const el = document.createElement('div');
                el.className = 'card3d';
                cards.appendChild(el);
                panels.set(id, el);
                updatePanels();
            }
            const el = panels.get(id);
            el.innerHTML = text.replace(/\n/g, '<br/>');
            return el;
        }

        function placePanel3D(el, corners) {
            if (!corners || corners.length !== 4) {
                el.style.display = 'none';
                return;
            }

            const ord = orderCorners(corners);
            const scr = ord.map(([x, y]) => imgToScreen(x, y));
            const matrix = cssMatrixForQuad(scr, el.offsetWidth || 260, el.offsetHeight || 140);
            el.style.transform = matrix;
            el.style.display = 'block';
        }

        // Socket.IO connection
        const socket = io(window.location.origin, {
            path: '/socket.io',
            transports: ['polling', 'websocket'],
            reconnection: true
        });

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            status.textContent = '✅ Connected';
            status.className = 'status-connected';
        });

        socket.on('disconnect', (reason) => {
            console.log('❌ Disconnected:', reason);
            status.textContent = `❌ Disconnected: ${reason}`;
            status.className = 'status-disconnected';
        });

        socket.on('gemini_result', (result) => {
            console.log('📡 Gemini result received:', result);

            const overlays = [{
                id: 1,
                text: `${result.answer}\n[${result.object}]`,
                corners: result.corners || generateCornersFromPosition(result.position, result.location)
            }];

            const live = new Set();
            overlays.forEach(o => {
                const text = o.text || o.label || '…';
                const el = ensurePanel(o.id || 0, text);
                placePanel3D(el, o.corners);
                live.add(o.id || 0);
            });

            panels.forEach((el, id) => {
                if (!live.has(id)) el.style.display = 'none';
            });
        });

        function generateCornersFromPosition(position, location) {
            const locationMap = {
                'top-left': [0.20, 0.20],
                'top-center': [0.50, 0.20],
                'top-right': [0.80, 0.20],
                'center-left': [0.20, 0.50],
                'center': [0.50, 0.50],
                'center-right': [0.80, 0.50],
                'bottom-left': [0.20, 0.80],
                'bottom-center': [0.50, 0.80],
                'bottom-right': [0.80, 0.80]
            };

            const [nx, ny] = locationMap[location] || [0.5, 0.5];
            const cx = nx * imgW;
            const cy = ny * imgH;

            const size = 100;
            return [
                [cx - size, cy - size],
                [cx + size, cy - size],
                [cx + size, cy + size],
                [cx - size, cy + size]
            ];
        }

        // Three.js render loop
        function tick() {
            requestAnimationFrame(tick);
            renderer.render(scene, camera);
        }
        tick();

        // Window resize handler
        function onResize() {
            renderer.setSize(wrap.clientWidth, wrap.clientHeight);
            setCameraFromIntrinsics();
        }
        addEventListener('resize', onResize);

        setupControls();
        console.log('✅ 3D Depth-Aware Overlay system initialized');
    </script>
</body>

</html>
