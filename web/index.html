<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI Glasses - 3D Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 3D text card overlay - NO BLUR! */
        .card3d {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 50% 50%;
            padding: 12px 16px;
            width: 260px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 255, 160, 0.6);
            border-radius: 8px;
            /* REMOVED backdrop-filter blur! */
            color: #00ff88;
            font: 700 22px/1.18 "Inter", system-ui;
            will-change: transform;
        }

        /* Parent holds camera perspective for 3D look */
        #cards {
            position: absolute;
            inset: 0;
            pointer-events: none;
            perspective: 900px;
        }

        /* Status overlay */
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.5);
            font-size: 14px;
            z-index: 100;
        }

        .status-connected {
            color: #0f0;
        }

        .status-disconnected {
            color: #f00;
        }

        /* Control panel for real-time adjustments */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            min-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            font-size: 12px;
        }

        #controls h3 {
            margin: 0 0 10px 0;
            color: #0f0;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 3px;
            color: #aaa;
            font-size: 11px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-group .value {
            display: inline-block;
            float: right;
            color: #0f0;
            font-weight: bold;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: 1px solid #555;
            background: #222;
            cursor: pointer;
        }

        #toggle-controls {
            position: absolute;
            bottom: 20px;
            left: 340px;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #0f0;
            cursor: pointer;
            font-size: 12px;
            z-index: 101;
        }

        #toggle-controls:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .controls-hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <img id="feed" src="/video_feed" alt="Camera Feed" />
        <div id="cards"></div>
        <div id="status" class="status-disconnected">Connecting...</div>

        <button id="toggle-controls">Toggle Controls</button>

        <div id="controls">
            <h3>3D Overlay Settings</h3>

            <div class="control-group">
                <label>Text Shadow Blur <span class="value" id="val-shadow-blur">10</span>px</label>
                <input type="range" id="shadow-blur" min="0" max="30" value="10" step="1">
            </div>

            <div class="control-group">
                <label>Text Shadow Spread <span class="value" id="val-shadow-spread">20</span>px</label>
                <input type="range" id="shadow-spread" min="0" max="50" value="20" step="1">
            </div>

            <div class="control-group">
                <label>Box Shadow Depth <span class="value" id="val-box-shadow">30</span>px</label>
                <input type="range" id="box-shadow" min="0" max="60" value="30" step="1">
            </div>

            <div class="control-group">
                <label>Background Opacity <span class="value" id="val-bg-opacity">0.70</span></label>
                <input type="range" id="bg-opacity" min="0" max="100" value="70" step="1">
            </div>

            <div class="control-group">
                <label>Border Opacity <span class="value" id="val-border-opacity">0.60</span></label>
                <input type="range" id="border-opacity" min="0" max="100" value="60" step="1">
            </div>

            <div class="control-group">
                <label>Border Width <span class="value" id="val-border-width">2</span>px</label>
                <input type="range" id="border-width" min="0" max="10" value="2" step="1">
            </div>

            <div class="control-group">
                <label>Text Color</label>
                <input type="color" id="text-color" value="#00ff88">
            </div>

            <div class="control-group">
                <label>Border Color</label>
                <input type="color" id="border-color" value="#00ffa0">
            </div>

            <div class="control-group">
                <label>Font Size <span class="value" id="val-font-size">22</span>px</label>
                <input type="range" id="font-size" min="12" max="40" value="22" step="1">
            </div>

            <div class="control-group">
                <label>Perspective <span class="value" id="val-perspective">900</span>px</label>
                <input type="range" id="perspective" min="300" max="2000" value="900" step="50">
            </div>

            <div class="control-group">
                <label>Max Pitch <span class="value" id="val-max-pitch">55</span>°</label>
                <input type="range" id="max-pitch" min="0" max="90" value="55" step="5">
            </div>

            <div class="control-group">
                <label>Max Scale <span class="value" id="val-max-scale">3.0</span>x</label>
                <input type="range" id="max-scale" min="1.0" max="5.0" value="3.0" step="0.1">
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        console.log('🚀 AURA AI Glasses - 3D Overlay System');

        const wrap = document.getElementById('wrap');
        const feed = document.getElementById('feed');
        const cards = document.getElementById('cards');
        const status = document.getElementById('status');
        const panels = new Map();

        // Adjustable parameters
        const params = {
            shadowBlur: 10,
            shadowSpread: 20,
            boxShadow: 30,
            bgOpacity: 0.7,
            borderOpacity: 0.6,
            borderWidth: 2,
            textColor: '#00ff88',
            borderColor: '#00ffa0',
            fontSize: 22,
            perspective: 900,
            maxPitch: 55,
            maxScale: 3.0
        };

        // Setup control sliders
        function setupControls() {
            const controls = {
                'shadow-blur': (v) => { params.shadowBlur = v; updatePanels(); },
                'shadow-spread': (v) => { params.shadowSpread = v; updatePanels(); },
                'box-shadow': (v) => { params.boxShadow = v; updatePanels(); },
                'bg-opacity': (v) => { params.bgOpacity = v / 100; updatePanels(); },
                'border-opacity': (v) => { params.borderOpacity = v / 100; updatePanels(); },
                'border-width': (v) => { params.borderWidth = v; updatePanels(); },
                'text-color': (v) => { params.textColor = v; updatePanels(); },
                'border-color': (v) => { params.borderColor = v; updatePanels(); },
                'font-size': (v) => { params.fontSize = v; updatePanels(); },
                'perspective': (v) => { params.perspective = v; cards.style.perspective = `${v}px`; },
                'max-pitch': (v) => { params.maxPitch = v; updatePanels(); },
                'max-scale': (v) => { params.maxScale = parseFloat(v); updatePanels(); }
            };

            Object.keys(controls).forEach(id => {
                const el = document.getElementById(id);
                const valEl = document.getElementById(`val-${id}`);

                el.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (valEl) {
                        if (id === 'bg-opacity' || id === 'border-opacity') {
                            valEl.textContent = (val / 100).toFixed(2);
                        } else if (id === 'max-scale') {
                            valEl.textContent = parseFloat(val).toFixed(1);
                        } else {
                            valEl.textContent = val;
                        }
                    }
                    controls[id](val);
                });
            });

            // Toggle controls visibility
            document.getElementById('toggle-controls').addEventListener('click', () => {
                document.getElementById('controls').classList.toggle('controls-hidden');
            });
        }

        // Update all panel styles
        function updatePanels() {
            panels.forEach(el => {
                el.style.background = `rgba(0, 0, 0, ${params.bgOpacity})`;
                el.style.border = `${params.borderWidth}px solid rgba(${hexToRgb(params.borderColor)}, ${params.borderOpacity})`;
                el.style.color = params.textColor;
                el.style.fontSize = `${params.fontSize}px`;
                el.style.textShadow = `0 0 ${params.shadowBlur}px ${params.textColor}, 0 0 ${params.shadowSpread}px ${params.textColor}`;
                el.style.boxShadow = `0 10px ${params.boxShadow}px rgba(0, 0, 0, 0.5)`;
            });
        }

        // Convert hex to RGB
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        // Convert image coordinates to screen coordinates
        function imgToScreen(x, y) {
            const vw = wrap.clientWidth, vh = wrap.clientHeight;
            const imgW = 640, imgH = 480;
            const s = Math.min(vw / imgW, vh / imgH);
            const dispW = imgW * s, dispH = imgH * s;
            const offX = (vw - dispW) / 2, offY = (vh - dispH) / 2;
            return [offX + x * s, offY + y * s];
        }

        // Create or get panel element
        function ensurePanel(id, text) {
            if (!panels.has(id)) {
                const el = document.createElement('div');
                el.className = 'card3d';
                cards.appendChild(el);
                panels.set(id, el);
                updatePanels(); // Apply current styles
            }
            const el = panels.get(id);
            el.innerHTML = text.replace(/\n/g, '<br/>');
            return el;
        }

        // Position panel in 3D using quad corners
        function placePanel3D(el, corners) {
            if (!corners || corners.length !== 4) {
                el.style.display = 'none';
                return;
            }

            const [a, b, c, d] = corners;

            // Convert to screen space
            const [ax, ay] = imgToScreen(a[0], a[1]);
            const [bx, by] = imgToScreen(b[0], b[1]);
            const [cx, cy] = imgToScreen(c[0], c[1]);
            const [dx, dy] = imgToScreen(d[0], d[1]);

            // Calculate center
            const cxm = (ax + bx + cx + dx) / 4;
            const cym = (ay + by + cy + dy) / 4;

            // Calculate edge lengths
            const lenTop = Math.hypot(bx - ax, by - ay);
            const lenBot = Math.hypot(cx - dx, cy - dy);

            // Yaw (rotation around Z-axis) from top edge angle
            const yawDeg = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;

            // Pitch (rotation around X-axis) from perspective foreshortening
            const pitchRatio = (lenTop - lenBot) / Math.max(1, (lenTop + lenBot) / 2);
            const pitchDeg = Math.max(-params.maxPitch, Math.min(params.maxPitch, pitchRatio * 75));

            // Scale from average width
            const targetW = (lenTop + lenBot) / 2;
            const scale = Math.max(0.5, Math.min(params.maxScale, targetW / 260));

            // Apply 3D transform
            el.style.display = 'block';
            el.style.left = `${cxm}px`;
            el.style.top = `${cym}px`;
            el.style.transform = `
                translate(-50%, -50%)
                rotateZ(${yawDeg}deg)
                rotateX(${pitchDeg}deg)
                scale(${scale})
            `;
        }

        // Socket.IO connection
        const socket = io(window.location.origin, {
            path: '/socket.io',
            transports: ['polling', 'websocket'],
            reconnection: true
        });

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            status.textContent = '✅ Connected';
            status.className = 'status-connected';
        });

        socket.on('disconnect', (reason) => {
            console.log('❌ Disconnected:', reason);
            status.textContent = `❌ Disconnected: ${reason}`;
            status.className = 'status-disconnected';
        });

        socket.on('gemini_result', (result) => {
            console.log('📡 Gemini result received:', result);

            const overlays = [{
                id: 1,
                text: `${result.answer}\n[${result.object}]`,
                corners: result.corners || generateCornersFromPosition(result.position, result.location)
            }];

            const live = new Set();
            overlays.forEach(o => {
                const text = o.text || o.label || '…';
                const el = ensurePanel(o.id || 0, text);
                placePanel3D(el, o.corners);
                live.add(o.id || 0);
            });

            panels.forEach((el, id) => {
                if (!live.has(id)) el.style.display = 'none';
            });
        });

        function generateCornersFromPosition(position, location) {
            const imgW = 640, imgH = 480;

            const locationMap = {
                'top-left': [0.20, 0.20],
                'top-center': [0.50, 0.20],
                'top-right': [0.80, 0.20],
                'center-left': [0.20, 0.50],
                'center': [0.50, 0.50],
                'center-right': [0.80, 0.50],
                'bottom-left': [0.20, 0.80],
                'bottom-center': [0.50, 0.80],
                'bottom-right': [0.80, 0.80]
            };

            const [nx, ny] = locationMap[location] || [0.5, 0.5];
            const cx = nx * imgW;
            const cy = ny * imgH;

            const size = 100;
            return [
                [cx - size, cy - size],
                [cx + size, cy - size],
                [cx + size, cy + size],
                [cx - size, cy + size]
            ];
        }

        // Initialize controls
        setupControls();
        console.log('✅ 3D Overlay system initialized with interactive controls');
    </script>
</body>

</html>
