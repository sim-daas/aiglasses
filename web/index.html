<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI Glasses - 3D Depth Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }

        /* Split-screen layout - both feeds equal size */
        .feed-container {
            position: relative;
            width: 50%;
            height: 100vh;
            overflow: hidden;
        }

        .feed-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0.95);
        }

        .feed-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #0f0;
            border: 1px solid rgba(0, 255, 0, 0.5);
            z-index: 10;
        }

        /* Three.js canvas for depth occlusion (only on AR feed) */
        canvas {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        #cards {
            position: absolute;
            inset: 0;
            pointer-events: none;
            perspective: 900px;
            transform-style: preserve-3d;
        }

        .card3d {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            transform-style: preserve-3d;
            width: 260px;
            height: 140px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 0px solid rgba(0, 255, 160, 0.23);
            border-radius: 8px;
            color: #00ff88;
            font: 700 22px/1.18 "Inter", system-ui;
            will-change: transform;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        #status {
            position: absolute;
            top: 50px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.5);
            font-size: 14px;
            z-index: 100;
            max-width: 45%;
        }

        .status-connected {
            color: #0f0;
        }

        .status-disconnected {
            color: #f00;
        }

        #depth-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            font-size: 12px;
            z-index: 100;
            color: #0f0;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            min-width: 250px;
            max-width: 45%;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 100;
            font-size: 12px;
        }

        #controls h3 {
            margin: 0 0 10px 0;
            color: #0f0;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 3px;
            color: #aaa;
            font-size: 10px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-group .value {
            display: inline-block;
            float: right;
            color: #0f0;
            font-weight: bold;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 25px;
            border: 1px solid #555;
            background: #222;
            cursor: pointer;
        }

        #toggle-controls {
            position: absolute;
            bottom: 20px;
            left: 270px;
            background: rgba(0, 0, 0, 0.9);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #0f0;
            cursor: pointer;
            font-size: 11px;
            z-index: 101;
        }

        #toggle-controls:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .controls-hidden {
            display: none;
        }

        /* Divider between feeds */
        .divider {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom,
                    transparent,
                    rgba(0, 255, 0, 0.5) 20%,
                    rgba(0, 255, 0, 0.5) 80%,
                    transparent);
            z-index: 5;
        }

        /* Test button */
        #test-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 200, 0, 0.9);
            padding: 20px 40px;
            border-radius: 12px;
            border: 2px solid #0f0;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.5);
            transition: all 0.3s;
        }

        #test-button:hover {
            background: rgba(0, 255, 0, 1);
            transform: translate(-50%, -50%) scale(1.05);
        }

        #test-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        #test-button.hidden {
            display: none;
        }

        #test-button.processing {
            background: rgba(255, 150, 0, 0.9);
            border-color: #fa0;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <!-- Left side: AR Visualization Feed (clean) -->
        <div class="feed-container" id="ar-container">
            <span class="feed-label">AR Visualization</span>
            <img id="feed" src="/video_feed" alt="AR Feed" />

            <!-- Test Button -->
            <button id="test-button">🧪 Test Gemini Query</button>

            <!-- Three.js canvas for 3D overlays -->
            <div id="cards"></div>

            <div id="status" class="status-disconnected">Connecting...</div>

            <div id="depth-info">
                Depth: <span id="depth-value">--</span> cm<br>
                3D Mode: <span id="mode-3d">Loading...</span>
            </div>

            <button id="toggle-controls">Toggle Controls</button>

            <div id="controls" class="controls-hidden">
                <h3>3D Overlay Settings</h3>

                <div class="control-group">
                    <label>Shadow Blur <span class="value" id="val-shadow-blur">0</span>px</label>
                    <input type="range" id="shadow-blur" min="0" max="30" value="0" step="1">
                </div>

                <div class="control-group">
                    <label>Shadow Spread <span class="value" id="val-shadow-spread">0</span>px</label>
                    <input type="range" id="shadow-spread" min="0" max="50" value="0" step="1">
                </div>

                <div class="control-group">
                    <label>Box Shadow <span class="value" id="val-box-shadow">7</span>px</label>
                    <input type="range" id="box-shadow" min="0" max="60" value="7" step="1">
                </div>

                <div class="control-group">
                    <label>BG Opacity <span class="value" id="val-bg-opacity">0.35</span></label>
                    <input type="range" id="bg-opacity" min="0" max="100" value="35" step="1">
                </div>

                <div class="control-group">
                    <label>Border Opacity <span class="value" id="val-border-opacity">0.23</span></label>
                    <input type="range" id="border-opacity" min="0" max="100" value="23" step="1">
                </div>

                <div class="control-group">
                    <label>Border Width <span class="value" id="val-border-width">0</span>px</label>
                    <input type="range" id="border-width" min="0" max="10" value="0" step="1">
                </div>

                <div class="control-group">
                    <label>Text Color</label>
                    <input type="color" id="text-color" value="#00ff88">
                </div>

                <div class="control-group">
                    <label>Border Color</label>
                    <input type="color" id="border-color" value="#00ffa0">
                </div>

                <div class="control-group">
                    <label>Font Size <span class="value" id="val-font-size">22</span>px</label>
                    <input type="range" id="font-size" min="12" max="40" value="22" step="1">
                </div>

                <div class="control-group">
                    <label>Perspective <span class="value" id="val-perspective">900</span>px</label>
                    <input type="range" id="perspective" min="300" max="2000" value="900" step="50">
                </div>

                <div class="control-group">
                    <label>
                        <input type="checkbox" id="enable-depth-occlusion" checked>
                        Depth Occlusion
                    </label>
                </div>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Right side: Gesture Keyboard Feed -->
        <div class="feed-container" id="keyboard-container">
            <span class="feed-label">Gesture Keyboard</span>
            <img id="keyboard-feed" src="/keyboard_feed" alt="Gesture Keyboard" />
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script>
        console.log('🚀 AURA AI Glasses - Split-Screen: AR + Keyboard');

        const wrap = document.getElementById('ar-container');
        const feed = document.getElementById('feed');
        const cards = document.getElementById('cards');
        const status = document.getElementById('status');
        const depthValueEl = document.getElementById('depth-value');
        const mode3dEl = document.getElementById('mode-3d');
        const panels = new Map();

        // Adjustable parameters
        const params = {
            shadowBlur: 0,
            shadowSpread: 0,
            boxShadow: 7,
            bgOpacity: 0.35,
            borderOpacity: 0.23,
            borderWidth: 0,
            textColor: '#00ff88',
            borderColor: '#00ffa0',
            fontSize: 22,
            perspective: 900
        };

        // Three.js setup (optional, for future depth occlusion)
        let depthOcclusionEnabled = false;
        mode3dEl.textContent = 'CSS Only';

        // Setup control sliders
        function setupControls() {
            const controls = {
                'shadow-blur': (v) => { params.shadowBlur = v; updatePanels(); },
                'shadow-spread': (v) => { params.shadowSpread = v; updatePanels(); },
                'box-shadow': (v) => { params.boxShadow = v; updatePanels(); },
                'bg-opacity': (v) => { params.bgOpacity = v / 100; updatePanels(); },
                'border-opacity': (v) => { params.borderOpacity = v / 100; updatePanels(); },
                'border-width': (v) => { params.borderWidth = v; updatePanels(); },
                'text-color': (v) => { params.textColor = v; updatePanels(); },
                'border-color': (v) => { params.borderColor = v; updatePanels(); },
                'font-size': (v) => { params.fontSize = v; updatePanels(); },
                'perspective': (v) => { params.perspective = v; cards.style.perspective = `${v}px`; }
            };

            Object.keys(controls).forEach(id => {
                const el = document.getElementById(id);
                const valEl = document.getElementById(`val-${id}`);

                if (el) {
                    el.addEventListener('input', (e) => {
                        const val = e.target.value;
                        if (valEl) {
                            if (id === 'bg-opacity' || id === 'border-opacity') {
                                valEl.textContent = (val / 100).toFixed(2);
                            } else {
                                valEl.textContent = val;
                            }
                        }
                        controls[id](val);
                    });
                }
            });

            document.getElementById('toggle-controls').addEventListener('click', () => {
                document.getElementById('controls').classList.toggle('controls-hidden');
            });
        }

        function updatePanels() {
            panels.forEach(el => {
                el.style.background = `rgba(0, 0, 0, ${params.bgOpacity})`;
                el.style.border = `${params.borderWidth}px solid rgba(${hexToRgb(params.borderColor)}, ${params.borderOpacity})`;
                el.style.color = params.textColor;
                el.style.fontSize = `${params.fontSize}px`;
                if (params.shadowBlur > 0 || params.shadowSpread > 0) {
                    el.style.textShadow = `0 0 ${params.shadowBlur}px ${params.textColor}, 0 0 ${params.shadowSpread}px ${params.textColor}`;
                } else {
                    el.style.textShadow = 'none';
                }
                el.style.boxShadow = `0 10px ${params.boxShadow}px rgba(0, 0, 0, 0.5)`;
            });
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function imgToScreen(x, y) {
            const imgW = 640, imgH = 480;
            const container = document.getElementById('ar-container');
            const vw = container.clientWidth, vh = container.clientHeight;
            const s = Math.min(vw / imgW, vh / imgH);
            const dispW = imgW * s, dispH = imgH * s;
            const offX = (vw - dispW) / 2, offY = (vh - dispH) / 2;
            return [offX + x * imgW * s, offY + y * imgH * s];
        }

        function ensurePanel(id, text) {
            if (!panels.has(id)) {
                const el = document.createElement('div');
                el.className = 'card3d';
                cards.appendChild(el);
                panels.set(id, el);
                updatePanels();
            }
            const el = panels.get(id);
            el.innerHTML = text.replace(/\n/g, '<br/>');
            return el;
        }

        function placePanel(el, position, location) {
            const [x, y] = imgToScreen(position.x, position.y);

            // Simple placement at position
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.transform = 'translate(-50%, -50%)';
            el.style.display = 'block';

            console.log(`Panel positioned at screen (${x.toFixed(0)}, ${y.toFixed(0)}) from normalized (${position.x}, ${position.y})`);
        }

        // Socket.IO connection
        const socket = io(window.location.origin, {
            path: '/socket.io',
            transports: ['polling', 'websocket'],
            reconnection: true
        });

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            status.textContent = '✅ Connected';
            status.className = 'status-connected';
        });

        socket.on('disconnect', (reason) => {
            console.log('❌ Disconnected:', reason);
            status.textContent = `❌ Disconnected: ${reason}`;
            status.className = 'status-disconnected';
        });

        // Test button functionality
        const testButton = document.getElementById('test-button');
        testButton.addEventListener('click', async () => {
            console.log('🧪 Test button clicked');

            // Change button state
            testButton.textContent = '⏳ Processing...';
            testButton.classList.add('processing');
            testButton.disabled = true;

            try {
                const response = await fetch('/test_query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: 'What objects do you see in this image? Describe their locations.'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    console.log('✅ Test query successful:', data.result);
                    // Hide button after 3 seconds
                    setTimeout(() => {
                        testButton.classList.add('hidden');
                    }, 3000);
                } else {
                    console.error('❌ Test query failed:', data.error);
                    alert('Test failed: ' + data.error);
                }
            } catch (error) {
                console.error('❌ Test request error:', error);
                alert('Test request failed: ' + error.message);
            } finally {
                // Reset button
                testButton.textContent = '🧪 Test Gemini Query';
                testButton.classList.remove('processing');
                testButton.disabled = false;
            }
        });

        socket.on('gemini_result', (result) => {
            console.log('📡 ========== GEMINI RESULT RECEIVED ==========');
            console.log('Full result:', result);
            console.log('==============================================');

            // Hide test button when result arrives
            testButton.classList.add('hidden');

            // Update status text
            status.innerHTML =
                `<strong>Q:</strong> ${result.transcription}<br>` +
                `<strong>A:</strong> ${result.answer}<br>` +
                `<strong>Object:</strong> ${result.object}<br>` +
                `<strong>Location:</strong> ${result.location}`;
            status.className = 'status-connected';

            // Create/update 3D text panel
            const overlays = [{
                id: 1,
                text: `${result.answer}\n\n[${result.object}]`,
                position: result.position,
                location: result.location
            }];

            const live = new Set();
            overlays.forEach(o => {
                const el = ensurePanel(o.id || 0, o.text);
                placePanel(el, o.position, o.location);
                live.add(o.id || 0);
            });

            // Hide stale panels
            panels.forEach((el, id) => {
                if (!live.has(id)) {
                    el.style.display = 'none';
                }
            });

            console.log('✅ Panel displayed successfully');

            // Auto-hide after 15 seconds
            setTimeout(() => {
                panels.forEach(el => el.style.display = 'none');
                console.log('🗑️ Panel auto-hidden after timeout');
            }, 15000);
        });

        // Initialize
        setupControls();
        cards.style.perspective = `${params.perspective}px`;

        console.log('✅ Split-screen initialized: 50/50 AR + Keyboard feeds');
    </script>
</body>

</html>
