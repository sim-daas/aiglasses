<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA AI Glasses - 3D Depth Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0.95);
        }

        /* Three.js canvas for depth occlusion */
        canvas {
            position: absolute;
            inset: 0;
            pointer-events: auto;
        }

        /* 3D text card overlay with proper transform support */
        .card3d {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            transform-style: preserve-3d;
            width: 260px;
            height: 140px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 0px solid rgba(0, 255, 160, 0.23);
            border-radius: 8px;
            color: #00ff88;
            font: 700 22px/1.18 "Inter", system-ui;
            will-change: transform;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        #cards {
            position: absolute;
            inset: 0;
            pointer-events: none;
            perspective: 900px;
            transform-style: preserve-3d;
        }

        /* Status overlay */
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.5);
            font-size: 14px;
            z-index: 100;
        }

        .status-connected {
            color: #0f0;
        }

        .status-disconnected {
            color: #f00;
        }

        /* HUD controls */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        #hud input {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #eee;
            font-size: 14px;
        }

        #ask {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #3a3;
            background: #0b3;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        #ask:hover {
            background: #0d5;
        }

        /* Control panel */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            min-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            font-size: 12px;
        }

        #controls h3 {
            margin: 0 0 10px 0;
            color: #0f0;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 3px;
            color: #aaa;
            font-size: 11px;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #0f0;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-group .value {
            display: inline-block;
            float: right;
            color: #0f0;
            font-weight: bold;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 30px;
            border: 1px solid #555;
            background: #222;
            cursor: pointer;
        }

        #toggle-controls {
            position: absolute;
            bottom: 20px;
            left: 340px;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #0f0;
            cursor: pointer;
            font-size: 12px;
            z-index: 101;
        }

        #toggle-controls:hover {
            background: rgba(0, 255, 0, 0.1);
        }

        .controls-hidden {
            display: none;
        }

        /* Depth info panel */
        #depth-info {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            font-size: 12px;
            z-index: 100;
            color: #0f0;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <img id="feed" src="/video_feed" alt="Camera Feed" />

        <!-- Three.js canvas will be inserted here -->

        <div id="cards"></div>

        <div id="hud">
            <input id="q" size="32" placeholder="Type a question, tap object, hit Ask…" />
            <button id="ask">Ask</button>
        </div>

        <div id="status" class="status-disconnected">Connecting...</div>

        <div id="depth-info">
            Depth: <span id="depth-value">--</span> cm<br>
            3D Mode: <span id="mode-3d">Loading...</span>
        </div>

        <button id="toggle-controls">Toggle Controls</button>

        <div id="controls">
            <h3>3D Overlay Settings</h3>

            <div class="control-group">
                <label>Text Shadow Blur <span class="value" id="val-shadow-blur">0</span>px</label>
                <input type="range" id="shadow-blur" min="0" max="30" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Text Shadow Spread <span class="value" id="val-shadow-spread">0</span>px</label>
                <input type="range" id="shadow-spread" min="0" max="50" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Box Shadow Depth <span class="value" id="val-box-shadow">7</span>px</label>
                <input type="range" id="box-shadow" min="0" max="60" value="7" step="1">
            </div>

            <div class="control-group">
                <label>Background Opacity <span class="value" id="val-bg-opacity">0.35</span></label>
                <input type="range" id="bg-opacity" min="0" max="100" value="35" step="1">
            </div>

            <div class="control-group">
                <label>Border Opacity <span class="value" id="val-border-opacity">0.23</span></label>
                <input type="range" id="border-opacity" min="0" max="100" value="23" step="1">
            </div>

            <div class="control-group">
                <label>Border Width <span class="value" id="val-border-width">0</span>px</label>
                <input type="range" id="border-width" min="0" max="10" value="0" step="1">
            </div>

            <div class="control-group">
                <label>Text Color</label>
                <input type="color" id="text-color" value="#00ff88">
            </div>

            <div class="control-group">
                <label>Border Color</label>
                <input type="color" id="border-color" value="#00ffa0">
            </div>

            <div class="control-group">
                <label>Font Size <span class="value" id="val-font-size">22</span>px</label>
                <input type="range" id="font-size" min="12" max="40" value="22" step="1">
            </div>

            <div class="control-group">
                <label>Perspective <span class="value" id="val-perspective">900</span>px</label>
                <input type="range" id="perspective" min="300" max="2000" value="900" step="50">
            </div>

            <div class="control-group">
                <label>
                    <input type="checkbox" id="enable-depth-occlusion" checked>
                    Enable Depth Occlusion
                </label>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script>
        console.log('🚀 AURA AI Glasses - 3D Depth-Aware Overlay');

        const wrap = document.getElementById('wrap');
        const feed = document.getElementById('feed');
        const cards = document.getElementById('cards');
        const status = document.getElementById('status');
        const depthValueEl = document.getElementById('depth-value');
        const mode3dEl = document.getElementById('mode-3d');
        const panels = new Map();

        // Depth smoothing for stable scaling
        let depthHistory = [];
        const DEPTH_HISTORY_SIZE = 10;
        let smoothedCenterDepth = 1.0; // meters

        // Three.js setup for depth occlusion
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(wrap.clientWidth, wrap.clientHeight);
        wrap.insertBefore(renderer.domElement, cards); // Insert before cards overlay

        let camera, fx = 900, fy = 900, cx = 320, cy = 240, imgW = 640, imgH = 480;

        function setCameraFromIntrinsics() {
            const fovY = 2 * Math.atan(imgH / (2 * fy)) * 180 / Math.PI;
            camera = new THREE.PerspectiveCamera(fovY, wrap.clientWidth / wrap.clientHeight, 0.05, 20);
            camera.position.set(0, 0, 0);
            camera.lookAt(0, 0, -1);
        }
        setCameraFromIntrinsics();

        // Depth mesh for occlusion
        let depthMesh, gridW = 0, gridH = 0, depthData = null;
        let depthOcclusionEnabled = true;

        function buildDepthMesh() {
            if (depthMesh) scene.remove(depthMesh);
            const geo = new THREE.PlaneGeometry(2, 2, gridW - 1, gridH - 1);
            const mat = new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true, depthTest: true });
            mat.colorWrite = false; // Pure occluder
            depthMesh = new THREE.Mesh(geo, mat);
            depthMesh.frustumCulled = false;
            scene.add(depthMesh);
            mode3dEl.textContent = `Active (${gridW}x${gridH})`;
        }

        // Convert image pixel + depth to 3D camera space
        function unproject(u, v, Z) {
            const X = (u - cx) / fx * Z;
            const Y = -(v - cy) / fy * Z;
            return new THREE.Vector3(X, Y, -Z);
        }

        // Update depth mesh vertices
        function updateDepthMesh() {
            if (!depthMesh || !depthData || !depthOcclusionEnabled) return;
            const pos = depthMesh.geometry.attributes.position;
            let idx = 0;
            for (let j = 0; j < gridH; j++) {
                for (let i = 0; i < gridW; i++) {
                    const Z = depthData[j * gridW + i] || 6.0;
                    const u = (i + 0.5) * (imgW / gridW);
                    const v = (j + 0.5) * (imgH / gridH);
                    const p = unproject(u, v, Math.max(0.05, Math.min(6.0, Z)));
                    pos.setXYZ(idx, p.x, p.y, p.z);
                    idx++;
                }
            }
            pos.needsUpdate = true;
            depthMesh.geometry.computeVertexNormals();
        }

        // Fetch depth grid from server
        async function fetchDepth() {
            try {
                const r = await fetch('/depth');
                const j = await r.json();
                if (j && j.z) {
                    imgW = j.w; imgH = j.h; fx = j.fx; fy = j.fy; cx = j.cx; cy = j.cy;
                    if (gridW !== j.gw || gridH !== j.gh) {
                        gridW = j.gw; gridH = j.gh;
                        buildDepthMesh();
                        setCameraFromIntrinsics();
                    }
                    depthData = j.z;
                    updateDepthMesh();

                    // Update and smooth center depth
                    const centerIdx = Math.floor(gridH / 2) * gridW + Math.floor(gridW / 2);
                    const rawDepth = depthData[centerIdx];
                    const smoothed = smoothDepth(rawDepth);

                    depthValueEl.textContent = (smoothed * 100).toFixed(0);

                    // Update all panels with current depth
                    panels.forEach((el) => {
                        if (el.style.display !== 'none') {
                            // Re-apply transform with updated depth
                            const cornersStr = el.getAttribute('data-corners');
                            if (cornersStr) {
                                const corners = JSON.parse(cornersStr);
                                placePanel3D(el, corners, smoothed);
                            }
                        }
                    });
                }
            } catch (e) {
                console.warn('Depth fetch failed:', e);
            }
            setTimeout(fetchDepth, 90);
        }
        // Start depth fetching
        fetchDepth();

        // Smooth depth value to reduce jitter
        function smoothDepth(newDepth) {
            if (!isFinite(newDepth) || newDepth <= 0) return smoothedCenterDepth;

            depthHistory.push(newDepth);
            if (depthHistory.length > DEPTH_HISTORY_SIZE) {
                depthHistory.shift();
            }

            // Use median for robustness
            const sorted = depthHistory.slice().sort((a, b) => a - b);
            smoothedCenterDepth = sorted[Math.floor(sorted.length / 2)];
            return smoothedCenterDepth;
        }

        // Calculate depth-aware scale (0.5x to 2x range)
        function getDepthScale(depth) {
            // Reference depth where scale = 1.0 (e.g., 1 meter)
            const refDepth = 1.0;

            // Calculate raw scale (inverse relationship: closer = bigger)
            const rawScale = refDepth / Math.max(0.3, depth);

            // Clamp to 0.5x - 2.0x range with smooth interpolation
            const minScale = 0.5;
            const maxScale = 2.0;
            const clampedScale = Math.max(minScale, Math.min(maxScale, rawScale));

            return clampedScale;
        }

        // Add perspective rotation based on position
        function calculate3DRotation(corners) {
            if (!corners || corners.length !== 4) return { rotX: 0, rotY: 0, rotZ: 0 };

            const [tl, tr, br, bl] = corners;

            // Calculate center
            const cx = (tl[0] + tr[0] + br[0] + bl[0]) / 4;
            const cy = (tl[1] + tr[1] + br[1] + bl[1]) / 4;

            // Calculate rotation from quad distortion
            const topWidth = Math.hypot(tr[0] - tl[0], tr[1] - tl[1]);
            const bottomWidth = Math.hypot(br[0] - bl[0], br[1] - bl[1]);
            const leftHeight = Math.hypot(bl[0] - tl[0], bl[1] - tl[1]);
            const rightHeight = Math.hypot(br[0] - tr[0], br[1] - tr[1]);

            // X rotation (pitch) from top/bottom width difference
            const pitchRatio = (topWidth - bottomWidth) / ((topWidth + bottomWidth) / 2);
            const rotX = Math.max(-45, Math.min(45, pitchRatio * 60));

            // Y rotation (yaw) from left/right height difference
            const yawRatio = (leftHeight - rightHeight) / ((leftHeight + rightHeight) / 2);
            const rotY = Math.max(-35, Math.min(35, yawRatio * 50));

            // Z rotation (roll) from top edge angle
            const topAngle = Math.atan2(tr[1] - tl[1], tr[0] - tl[0]);
            const rotZ = topAngle * 180 / Math.PI;

            return { rotX, rotY, rotZ };
        }

        // Enhanced placement with depth scaling and 3D effects
        function placePanel3D(el, corners, depthValue = null) {
            if (!corners || corners.length !== 4) {
                el.style.display = 'none';
                return;
            }

            const ord = orderCorners(corners);
            const scr = ord.map(([x, y]) => imgToScreen(x, y));

            // Get depth-based scale
            const depth = depthValue || smoothedCenterDepth;
            const depthScale = getDepthScale(depth);

            // Calculate 3D rotations
            const rotation = calculate3DRotation(ord);

            // Base homography matrix
            const matrix = cssMatrixForQuad(scr, el.offsetWidth || 260, el.offsetHeight || 140);

            // Apply depth scaling and rotation
            el.style.transform = `
                ${matrix}
                scale(${depthScale})
                rotateX(${rotation.rotX}deg)
                rotateY(${rotation.rotY}deg)
                translateZ(${-depth * 50}px)
            `;

            // Add depth-based opacity (far = slightly transparent)
            const opacityFactor = Math.max(0.7, Math.min(1.0, 2.0 / depth));
            el.style.opacity = opacityFactor;

            // Add depth-based blur (far = slight blur)
            const blurAmount = Math.max(0, Math.min(2, (depth - 1.0) * 0.5));
            el.style.filter = `blur(${blurAmount}px)`;

            el.style.display = 'block';

            console.log(`3D Transform: depth=${depth.toFixed(2)}m, scale=${depthScale.toFixed(2)}x, rotX=${rotation.rotX.toFixed(1)}°`);
        }

        function ensurePanel(id, text) {
            if (!panels.has(id)) {
                const el = document.createElement('div');
                el.className = 'card3d';
                cards.appendChild(el);
                panels.set(id, el);
                updatePanels();
            }
            const el = panels.get(id);
            el.innerHTML = text.replace(/\n/g, '<br/>');
            return el;
        }

        // Enhanced socket handler with depth info
        socket.on('gemini_result', (result) => {
            console.log('📡 Gemini result received:', result);

            const overlays = [{
                id: 1,
                text: `${result.answer}\n[${result.object}]`,
                corners: result.corners || generateCornersFromPosition(result.position, result.location),
                depth: result.position?.z || smoothedCenterDepth
            }];

            const live = new Set();
            overlays.forEach(o => {
                const text = o.text || o.label || '…';
                const el = ensurePanel(o.id || 0, text);

                // Store corners for depth updates
                el.setAttribute('data-corners', JSON.stringify(o.corners));

                placePanel3D(el, o.corners, o.depth);
                live.add(o.id || 0);
            });

            panels.forEach((el, id) => {
                if (!live.has(id)) el.style.display = 'none';
            });
        });

        function generateCornersFromPosition(position, location) {
            const locationMap = {
                'top-left': [0.20, 0.20],
                'top-center': [0.50, 0.20],
                'top-right': [0.80, 0.20],
                'center-left': [0.20, 0.50],
                'center': [0.50, 0.50],
                'center-right': [0.80, 0.50],
                'bottom-left': [0.20, 0.80],
                'bottom-center': [0.50, 0.80],
                'bottom-right': [0.80, 0.80]
            };

            const [nx, ny] = locationMap[location] || [0.5, 0.5];
            const cx = nx * imgW;
            const cy = ny * imgH;

            const size = 100;
            return [
                [cx - size, cy - size],
                [cx + size, cy - size],
                [cx + size, cy + size],
                [cx - size, cy + size]
            ];
        }

        // Three.js render loop
        function tick() {
            requestAnimationFrame(tick);
            renderer.render(scene, camera);
        }
        tick();

        // Window resize handler
        function onResize() {
            renderer.setSize(wrap.clientWidth, wrap.clientHeight);
            setCameraFromIntrinsics();
        }
        addEventListener('resize', onResize);

        setupControls();
        console.log('✅ 3D Depth-Aware Overlay system initialized');
    </script>
</body>

</html>
